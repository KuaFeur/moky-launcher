[package]
name = "moky-launcher"
version = "0.1.0-alpha.3"
edition = "2021"
description = "Official Minecraft launcher for Moky Studios"

[dependencies]
eframe = "0.31"
egui_material_icons = "0.3.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
tempfile = "3"
self-replace = "1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2"
keyring = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
mc-launcher-core = "0.1.2"
serde_json = "1"
