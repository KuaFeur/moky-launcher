name: Build Moky Launcher Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moky-launcher-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        run: cargo build --release

      - name: Prepare release binaries
        shell: pwsh
        run: |
          Copy-Item target/release/moky-launcher.exe MokyLauncher-Setup.exe
          Copy-Item target/release/moky-launcher.exe MokyLauncher.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MokyLauncher-Setup
          path: |
            MokyLauncher-Setup.exe
            MokyLauncher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish versioned release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: Moky Launcher v${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            MokyLauncher-Setup.exe
            MokyLauncher.exe

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MokyLauncher-Setup.exe
            MokyLauncher.exe
