name: Build Moky Launcher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release executable
        run: cargo build --release

      - name: Rename executable
        shell: pwsh
        run: Copy-Item target/release/moky-launcher.exe moky-launcher-windows-x86_64.exe

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: moky-launcher-windows-x86_64
          path: moky-launcher-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: moky-launcher-windows-x86_64.exe
