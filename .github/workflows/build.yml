name: Build Moky Launcher Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        run: cargo build --release

      - name: Prepare release binaries
        shell: pwsh
        run: |
          Copy-Item target/release/moky-launcher.exe MokyLauncher-Setup.exe
          Copy-Item target/release/moky-launcher.exe MokyLauncher.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MokyLauncher-Setup
          path: |
            MokyLauncher-Setup.exe
            MokyLauncher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Check whether alpha release already exists
        id: alpha
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            core.setOutput('exists', releases.some(release => release.tag_name === 'v0.1.0-alpha.1'));

      - name: Publish initial alpha release
        if: github.ref == 'refs/heads/main' && steps.alpha.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.1
          target_commitish: main
          name: Moky Launcher v0.1.0-alpha.1
          prerelease: true
          generate_release_notes: true
          files: |
            MokyLauncher-Setup.exe
            MokyLauncher.exe

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.1.0-alpha.1'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: MokyLauncher-Setup.exe
